# ─────────────────────────────────────────────────────────────────────
# Consumer setup — for users connecting to a remote cloud CouchDB
#
# Usage:
#   1. Copy .env.consumer.example to .env
#   2. Set CLOUD_HOST to the IP/domain of the machine running the cloud CouchDB
#   3. Set CLOUD_COUCH_USER / CLOUD_COUCH_PASS to the cloud credentials
#   4. Run: docker compose -f docker-compose.consumer.yml up --build
# ─────────────────────────────────────────────────────────────────────

version: "3.8"

services:
  # ─── Local CouchDB (consumer's own local-first database) ─────────
  couchdb-local:
    image: couchdb:3.3
    container_name: couchdb-local
    environment:
      COUCHDB_USER: ${LOCAL_COUCH_USER}
      COUCHDB_PASSWORD: ${LOCAL_COUCH_PASS}
    ports:
      - "5984:5984"
    volumes:
      - couchdb-local-data:/opt/couchdb/data
    networks:
      - sync-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5984/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (syncs local ↔ remote cloud CouchDB) ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sync-backend
    environment:
      PORT: 3001
      LOCAL_COUCHDB_URL: http://${LOCAL_COUCH_USER}:${LOCAL_COUCH_PASS}@couchdb-local:5984
      CLOUD_COUCHDB_URL: http://${CLOUD_COUCH_USER}:${CLOUD_COUCH_PASS}@${CLOUD_HOST}:${CLOUD_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      SYNC_MODE: ${SYNC_MODE}
    ports:
      - "3001:3001"
    depends_on:
      couchdb-local:
        condition: service_healthy
    networks:
      - sync-network
    restart: unless-stopped

  # ─── Frontend (React UI) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sync-frontend
    environment:
      VITE_API_URL: http://localhost:3001
      CLOUD_ONLY: ${CLOUD_ONLY:-false}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - sync-network

volumes:
  couchdb-local-data:

networks:
  sync-network:
    driver: bridge
